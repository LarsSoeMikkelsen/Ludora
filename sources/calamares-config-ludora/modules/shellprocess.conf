---
dontChroot: false
timeout: 800

script:
    # Remove packages from groups the user deselected in netinstall
    - command: "bash /etc/calamares/scripts/packagechooser-cleanup.sh"
      timeout: 300
    - command: "rm -f /tmp/ludora-selections"
      timeout: 30

    # Finalize machine-id before touching BLS entries.
    # During live image build the kernel is installed with a temporary machine-id;
    # systemd-firstboot would later assign a different one, leaving stale entries
    # that sort before the real ones and cause the wrong kernel to boot by default.
    - command: "systemd-machine-id-setup"
      timeout: 30
    # Remove all BLS entries created with the live-image machine-id
    - command: "find /boot/loader/entries -name '*.conf' -delete"
      timeout: 30
    # Regenerate initramfs for whichever kernels survived the cleanup step
    - command: "dracut --regenerate-all --force"
      timeout: 600
    # Regenerate BLS entries for all installed kernels using the correct machine-id
    - command: "kernel-install add-all"
      timeout: 300

    # Fix BLS entries to remove /boot/ prefix
    - command: "sed -i 's|^linux /boot/|linux /|g' /boot/loader/entries/*.conf"
      timeout: 30
    - command: "sed -i 's|^initrd /boot/|initrd /|g' /boot/loader/entries/*.conf"
      timeout: 30

    # Remove live-only skel artifacts from installed user homes
    - command: "find /home -name 'kscreenlockerrc' -path '*/.config/*' -delete"
      timeout: 30
    - command: "find /home -name 'install-ludora.desktop' -path '*/Desktop/*' -delete"
      timeout: 30
    - command: "find /home -name 'calamares-launcher.desktop' -path '*/.config/autostart/*' -delete"
      timeout: 30

    # Apply Ludora theme to all existing users in /home (only if KDE customizations were chosen)
    - command: "bash -c '[ -x /usr/local/bin/apply-ludora-theme-to-users.sh ] && /usr/local/bin/apply-ludora-theme-to-users.sh || true'"
      timeout: 60

    # Enable RPM Fusion repos on installed system
    - command: "dnf config-manager setopt rpmfusion-free.enabled=1"
      timeout: 30
    - command: "dnf config-manager setopt rpmfusion-free-updates.enabled=1"
      timeout: 30
    - command: "dnf config-manager setopt rpmfusion-nonfree.enabled=1"
      timeout: 30
    - command: "dnf config-manager setopt rpmfusion-nonfree-updates.enabled=1"
      timeout: 30
    - command: "dnf config-manager setopt rpmfusion-nonfree-steam.enabled=1"
      timeout: 30
    - command: "dnf config-manager setopt rpmfusion-nonfree-steam-source.enabled=1"
      timeout: 30

    # Enable OpenH264 repo on installed system
    - command: "dnf config-manager setopt fedora-cisco-openh264.enabled=1"
      timeout: 30
