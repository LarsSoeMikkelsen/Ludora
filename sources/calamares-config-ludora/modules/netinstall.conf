---
# Ludora Gaming Edition - Modular Package Selection
# This configuration defines the package tiers available during installation.
# Users can customize which components to install via checkbox UI.

# Use embedded groups (no remote fetching - all packages on ISO)
groupsUrl: local

# Package selection is optional (users can proceed with defaults)
required: false

# UI labels
label:
    sidebar: "Package Selection"
    title: "Customize Your Installation"

# Package groups/tiers
groups:
  # ========================================================================
  # TIER 0: Base System (Always Installed - Immutable)
  # ========================================================================
  - name: "Ludora Base System"
    description: "Core Fedora 43 KDE with Firefox and essential tools"
    selected: true
    immutable: true
    critical: true
    packages:
      # Fedora package groups
      - "@core"
      - "@base-x"
      - "@fonts"
      - "@hardware-support"
      - "@kde-desktop"
      - "@kde-apps"
      - "@multimedia"
      # Bootloader
      - grub2-pc
      - grub2-pc-modules
      - grub2-tools
      - grub2-efi-x64
      - grub2-efi-x64-cdboot
      - grub2-efi-x64-modules
      - shim-x64
      # Display manager
      - sddm
      - sddm-kcm
      # Essential tools
      - dnf-plugins-core
      - firefox
      # Calamares configuration
      - calamares-config-ludora

  # ========================================================================
  # Btrfs Snapshots (Always Installed - Visible but Immutable)
  # ========================================================================
  - name: "Bootable Btrfs Snapshots"
    description: "Automatic snapshots before system updates with grub-btrfs integration"
    selected: true
    immutable: true
    packages:
      - snapper
      - libdnf5-plugin-snapper
      - snapper-config-ludora
      - grub-btrfs

  # ========================================================================
  # TIER 1: Multimedia Codecs (Pre-checked, Optional)
  # ========================================================================
  - name: "Multimedia Codecs"
    description: "Audio/video codecs for media playback and game cutscenes (Recommended)"
    selected: true
    packages:
      - ffmpeg
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugins-ugly-free
      - gstreamer1-plugin-openh264
      - gstreamer1-libav
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-vaapi

  # ========================================================================
  # TIER 2: Custom Gaming Kernel (Pre-checked, Optional)
  # ========================================================================
  - name: "Custom Gaming Kernel (kernel-ludora)"
    description: "BORE scheduler + CachyOS patches for low-latency gaming performance (Recommended)"
    selected: true
    packages:
      - kernel-ludora
      - kernel-ludora-core
      - kernel-ludora-modules
    post-install: "dnf remove -y kernel kernel-core kernel-modules 2>/dev/null || true"

  # ========================================================================
  # TIER 3: Gaming Essentials (Pre-checked, Optional, Expandable)
  # ========================================================================
  - name: "Gaming Essentials"
    description: "Steam, gaming tools, performance utilities, and applications (Recommended)"
    selected: true
    expanded: true
    subgroups:
      # Core gaming packages (always installed if parent selected)
      - name: "Core Gaming Tools"
        description: "MangoHud, GameMode, Mesa/Vulkan drivers, and performance tools"
        selected: true
        packages:
          # Mesa/Vulkan stack
          - mesa-libGL
          - mesa-libGLU
          - mesa-libEGL
          - mesa-dri-drivers
          - mesa-vulkan-drivers
          - libva
          # Gaming performance tools
          - mangohud
          - goverlay
          - protonplus
          - gamemode
          - gamescope
          - vkbasalt
          - vulkan-tools
        post-install: "systemctl enable gamemoded 2>/dev/null || true"

      # Optional gaming applications (can individually uncheck)
      - name: "Steam"
        description: "Steam gaming platform"
        selected: true
        packages:
          - steam
        post-install: |
          mkdir -p /usr/share/steam/compatibilitytools.d
          PROTON_GE_VERSION=$(curl -s https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest | grep -Po '"tag_name": "\K.*?(?=")')
          if [ -n "$PROTON_GE_VERSION" ]; then
            curl -L -o /tmp/proton-ge.tar.gz "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/${PROTON_GE_VERSION}/${PROTON_GE_VERSION}.tar.gz" && \
            tar -xzf /tmp/proton-ge.tar.gz -C /usr/share/steam/compatibilitytools.d/ && \
            rm /tmp/proton-ge.tar.gz
          fi

      - name: "Lutris"
        description: "Open-source game launcher and library manager"
        selected: true
        packages:
          - lutris

      - name: "Discord"
        description: "Voice, video, and text chat for gamers"
        selected: true
        packages:
          - discord

  # ========================================================================
  # TIER 4: Ludora Theme & Branding (Pre-checked, Optional)
  # ========================================================================
  - name: "Ludora Theme & Branding"
    description: "Custom KDE theme, fastfetch, and desktop polish (Recommended)"
    selected: true
    packages:
      - fastfetch
      - fastfetch-settings
      - kde-ludora
      - desktop-defaults-ludora
