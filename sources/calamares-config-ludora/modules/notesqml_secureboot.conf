# Secure Boot / MOK enrollment page (instance notesqml@secureboot)
qmlSearch: both
qmlFilename: /etc/calamares/qml/ludora-secureboot.qml
# The sidebar label key must be "notes": notesqml only reads that key, and
# without it its label pointer is left uninitialised, so Calamares crashes
# when it first paints the sidebar (seen in beta6)
qmlLabel:
    notes: "Secure Boot"
    notes[zh_CN]: "安全启动"
    notes[ja]: "セキュアブート"
    notes[ko]: "보안 부팅"
