---
# Runs after removeuser, as the very last step before umount.
# The users and removeuser modules rewrite /etc/passwd, /etc/shadow, /etc/group
# and /etc/gshadow inside the chroot, leaving them labelled etc_t, which breaks
# passwd. Subvolume roots created by the installer (e.g. /var/lib/libvirt/images)
# end up unlabeled_t. Relabel the whole target from its own file_contexts.
# /.snapshots is excluded: snapshot contents keep their original labels.
# Calamares mounts a fresh sysfs in the chroot without selinuxfs, so libselinux
# thinks SELinux is disabled and restorecon silently does nothing (exit 0).
# Mount selinuxfs for the relabel and unmount it again before the umount module.
# Leading "-": a relabel failure must not fail an otherwise finished install.
dontChroot: false
timeout: 900

script:
    - "-mount -t selinuxfs selinuxfs /sys/fs/selinux"
    - command: "-restorecon -RF -e /.snapshots -e /proc -e /sys -e /dev -e /run /"
      timeout: 900
    - "-umount /sys/fs/selinux"
