---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true

sudoersConfigureWithGroup: false

setRootPassword: true
doReusePassword: false

doAutologin: false

# No password length requirements, but the password must not be empty.
# minLength: 0 disables the Calamares length check; nonempty: true still
# refuses an empty password. No libpwquality block: libpwquality enforces a
# hardcoded floor of 6 even with minlen=0, so omitting the block skips
# strength checking entirely.
passwordRequirements:
    nonempty: true
    minLength: 0

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: ""
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${login}-${product}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
