---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true

sudoersConfigureWithGroup: false

setRootPassword: true
doReusePassword: false

doAutologin: false

# No password length requirements — overrides Fedora's system pwquality.conf
# (minlen=10). minLength: 0 and an explicit libpwquality block with minlen=0
# disables both Calamares and libpwquality length enforcement.
passwordRequirements:
    minLength: 0
    libpwquality:
        - minlen=0
        - minclass=0

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: ""
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${login}-${product}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
