---
efiBootLoader: "grub"
# EFI: Fedora signed shim + GRUB instead of grub2-install (Secure Boot);
# BIOS: passes through to grub2-install
grubInstall: "/etc/calamares/scripts/ludora-grub-install"
grubMkconfig: "grub2-mkconfig"
grubCfg: "/boot/grub2/grub.cfg"
grubProbe: "grub2-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "Ludora"
installEFIFallback: false
