---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 600MiB
efiSystemPartitionName: "EFI-system"

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
initialSwapChoice: none

defaultFileSystemType: "btrfs"

availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs
    - f2fs
    - jfs

# Automatic partition layout (do NOT add separate EFI in partitionLayout - handled by efiSystemPartition above)
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      mountPoint: "/boot"
      size: 2048MiB
      minSize: 2048MiB
      maxSize: 4096MiB
      features:
        64bit: true

    - name: "root"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
      minSize: 10GiB
      features:
        compress: "zstd:1"

# LUKS encryption options
luksGeneration: luks1
allowLuksEncryption: true
