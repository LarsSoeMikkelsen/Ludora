---
modules-search: [ local, global ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - netinstall
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - dracut
  - ludora_selections
  - shellprocess
  - removeuser
  - umount
- show:
  - finished

branding: ludora

prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
